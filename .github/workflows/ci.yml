name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify workspace
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: vera_test
          POSTGRES_USER: vera
          POSTGRES_PASSWORD: vera_dev_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vera -d vera_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.14.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Check formatting
        run: pnpm format:check

      - name: Verify Calendar boundaries
        run: pnpm verify:calendar-boundaries

      - name: Verify database boundaries
        run: pnpm verify:db-boundaries

      - name: Verify browser boundaries
        run: pnpm verify:browser-boundaries

      - name: Verify Gmail read-only boundary
        run: pnpm verify:gmail-boundaries

      - name: Verify web mutation boundaries
        run: pnpm verify:web-mutation-boundaries

      - name: Verify web runtime boundaries
        run: pnpm verify:web-runtime-boundaries

      - name: Verify Railway web image boundaries
        run: pnpm verify:web-image-boundaries

      - name: Verify Maritime boundaries and deployment assets
        run: pnpm verify:maritime-boundaries && pnpm maritime:validate

      - name: Verify worker image supply-chain boundaries
        run: pnpm verify:worker-image-boundaries && pnpm verify:worker-release-workflow && pnpm verify:openclaw-config

      - name: Verify Gateway runtime and release boundaries
        run: pnpm verify:gateway-runtime-supply-chain && pnpm verify:remote-extension-config && pnpm verify:gateway-release-workflow && pnpm verify:gateway-registry-workflow && pnpm verify:gateway-runtime-attestation-workflow

      - name: Verify DigitalOcean browser Gateway deployment
        run: |
          pnpm verify:digitalocean-browser-gateway
          VERA_DO_VALIDATE_WITH_DOCKER=1 \
            bash infra/digitalocean/browser-gateway/validate.sh
          pnpm exec vitest run --project unit \
            infra/digitalocean/browser-gateway/resource-journal.unit.test.ts \
            infra/digitalocean/browser-gateway/managed-certificate.unit.test.ts \
            infra/digitalocean/browser-gateway/managed-load-balancer.unit.test.ts \
            infra/digitalocean/browser-gateway/lifecycle.unit.test.ts

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Test PostgreSQL persistence
        run: pnpm test:integration:postgres
        env:
          TEST_DATABASE_URL: postgresql://vera:vera_dev_only@127.0.0.1:5432/vera_test

      - name: Build
        run: pnpm build

  web_image:
    name: Build Railway web image
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Build Railway web image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: Dockerfile.web
          pull: true
          load: true
          push: false
          tags: vera-web:ci

      - name: Verify web-only runtime metadata
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker image inspect vera-web:ci --format '{{.Config.User}}')" = "vera"
          docker image inspect vera-web:ci --format '{{json .Config.Cmd}}' |
            grep -F 'node_modules/next/dist/bin/next'
          docker image inspect vera-web:ci --format '{{json .Config.Healthcheck.Test}}' |
            grep -F '/api/ready'

  gateway_image:
    name: Build and zero-scan Gateway image
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Build local Gateway candidate
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: infra/maritime/openclaw
          file: infra/maritime/openclaw/remote-extension.Dockerfile
          platforms: linux/amd64
          pull: true
          load: true
          push: false
          tags: vera-openclaw-gateway:ci
          build-args: |
            VERA_SOURCE_COMMIT=${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify minimal runtime identity
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-gateway-image-layout.mjs \
            --image-ref vera-openclaw-gateway:ci \
            --simulate-bootstrap

      - name: Install pinned Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.72.0
          cache: false

      - name: Enforce zero critical or high findings
        shell: bash
        run: |
          set -euo pipefail
          trivy --config /dev/null image --quiet --ignorefile /dev/null --list-all-pkgs \
            --scanners vuln --ignore-unfixed=false --severity CRITICAL,HIGH --exit-code 1 \
            vera-openclaw-gateway:ci
