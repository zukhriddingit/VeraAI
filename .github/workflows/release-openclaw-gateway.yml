name: Release immutable Vera OpenClaw Gateway

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact full source commit SHA reachable from merged main.
        required: true
        type: string

permissions: {}

concurrency:
  group: release-openclaw-gateway-${{ inputs.source_sha }}
  cancel-in-progress: false

env:
  IMAGE_REPOSITORY: ghcr.io/zukhriddingit/vera-openclaw-gateway
  TRUSTED_SOURCE_BRANCH: main

jobs:
  build_scan:
    name: Build and scan Gateway candidate
    if: github.repository == 'zukhriddingit/VeraAI' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
      image_ref: ${{ steps.image.outputs.image_ref }}
      source_sha: ${{ steps.source.outputs.source_sha }}

    steps:
      - name: Check out merged workflow branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve exact trusted source
        id: source
        shell: bash
        env:
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "zukhriddingit/VeraAI"
          test "$GITHUB_REF" = "refs/heads/$TRUSTED_SOURCE_BRANCH"
          [[ "$REQUESTED_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          git fetch --no-tags origin \
            "+refs/heads/$TRUSTED_SOURCE_BRANCH:refs/remotes/origin/$TRUSTED_SOURCE_BRANCH"
          git cat-file -e "$REQUESTED_SOURCE_SHA^{commit}"
          git merge-base --is-ancestor \
            "$REQUESTED_SOURCE_SHA" "origin/$TRUSTED_SOURCE_BRANCH"
          resolved_source_sha="$(git rev-parse "$REQUESTED_SOURCE_SHA^{commit}")"
          test "$resolved_source_sha" = "$REQUESTED_SOURCE_SHA"
          git checkout --detach "$REQUESTED_SOURCE_SHA"
          created_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          printf 'source_sha=%s\n' "$REQUESTED_SOURCE_SHA" >> "$GITHUB_OUTPUT"
          printf 'release_tag=r2-%s\n' "${REQUESTED_SOURCE_SHA:0:7}" >> "$GITHUB_OUTPUT"
          printf 'created_at=%s\n' "$created_at" >> "$GITHUB_OUTPUT"

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.14.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install exact-source dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify immutable source context
        shell: bash
        env:
          RELEASE_SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          set -euo pipefail
          git rev-parse HEAD | grep -Fx "$RELEASE_SOURCE_SHA"
          git diff --exit-code -- .
          git diff --cached --exit-code -- .
          test -f infra/maritime/openclaw/remote-extension.Dockerfile
          grep -F 'OPENCLAW_EAGER_BROWSER_CONTROL_SERVER=1' \
            infra/maritime/openclaw/remote-extension.Dockerfile
          grep -F 'const EXTENSION_ROUTE = "/browser/extension"' \
            infra/maritime/openclaw/remote-extension-route-filter.mjs
          pnpm verify:gateway-runtime-supply-chain
          pnpm verify:remote-extension-config

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PUBLISH_TOKEN }}

      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Build and publish the commit-bound Gateway
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: infra/maritime/openclaw
          file: infra/maritime/openclaw/remote-extension.Dockerfile
          platforms: linux/amd64
          pull: true
          push: true
          tags: ${{ env.IMAGE_REPOSITORY }}:${{ steps.source.outputs.release_tag }}
          build-args: |
            VERA_SOURCE_COMMIT=${{ steps.source.outputs.source_sha }}
          labels: |
            org.opencontainers.image.created=${{ steps.source.outputs.created_at }}
            org.opencontainers.image.revision=${{ steps.source.outputs.source_sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=Vera OpenClaw Browser Gateway
          provenance: mode=max
          sbom: true

      - name: Resolve immutable Gateway reference
        id: image
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          RELEASE_SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          image_ref="$IMAGE_REPOSITORY@$IMAGE_DIGEST"
          mkdir -p release-evidence/gateway
          printf '%s\n' "$image_ref" > release-evidence/gateway/image-reference.txt
          printf '%s\n' "$RELEASE_SOURCE_SHA" > release-evidence/gateway/source-commit.txt
          cp infra/maritime/openclaw/remote-extension-runtime-lock.json \
            release-evidence/gateway/remote-extension-runtime-lock.json
          sha256sum release-evidence/gateway/remote-extension-runtime-lock.json \
            > release-evidence/gateway/remote-extension-runtime-lock.sha256
          printf 'image_ref=%s\n' "$image_ref" >> "$GITHUB_OUTPUT"
          printf 'GATEWAY_IMAGE_REF=%s\n' "$image_ref" >> "$GITHUB_ENV"
          printf 'Published immutable Gateway: `%s`\n' "$image_ref" >> "$GITHUB_STEP_SUMMARY"

      - name: Install pinned Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.72.0
          cache: false

      - name: Verify minimal published runtime identity
        shell: bash
        run: |
          set -euo pipefail
          observed="$(docker run --rm --entrypoint /usr/bin/node \
            "$GATEWAY_IMAGE_REF" \
            -e 'const fs=require("node:fs"); process.stdout.write(JSON.stringify({uid:process.getuid(),gid:process.getgid(),executables:fs.readdirSync("/usr/bin").sort(),shell:fs.existsSync("/bin/sh"),npm:fs.existsSync("/usr/bin/npm"),npmLibrary:fs.existsSync("/usr/lib/node_modules"),corepack:fs.existsSync("/usr/bin/corepack"),pnpm:fs.existsSync("/usr/bin/pnpm")}));')"
          test "$observed" = '{"uid":1000,"gid":1000,"executables":["node"],"shell":false,"npm":false,"npmLibrary":false,"corepack":false,"pnpm":false}'

      - name: Generate SBOM and vulnerability evidence
        shell: bash
        run: |
          set -euo pipefail
          trivy --config /dev/null image --quiet --ignorefile /dev/null --list-all-pkgs \
            --format spdx-json \
            --output release-evidence/gateway/gateway.spdx.json \
            "$GATEWAY_IMAGE_REF"
          trivy --config /dev/null image --quiet --ignorefile /dev/null --list-all-pkgs \
            --scanners vuln --ignore-unfixed=false --severity CRITICAL,HIGH --exit-code 0 \
            --format json \
            --output release-evidence/gateway/trivy-vulnerabilities.json \
            "$GATEWAY_IMAGE_REF"
          trivy version --format json > release-evidence/gateway/trivy-version.json

      - name: Enforce zero unresolved critical or high findings
        shell: bash
        run: |
          set -euo pipefail
          test -s release-evidence/gateway/gateway.spdx.json
          test -s release-evidence/gateway/trivy-vulnerabilities.json
          trivy --config /dev/null image --quiet --ignorefile /dev/null --list-all-pkgs \
            --scanners vuln --ignore-unfixed=false --severity CRITICAL,HIGH --exit-code 1 \
            "$GATEWAY_IMAGE_REF"

      - name: Preserve pre-signing Gateway evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vera-openclaw-gateway-scan-${{ steps.source.outputs.source_sha }}
          path: release-evidence/gateway/
          if-no-files-found: warn
          retention-days: 30

  sign_attest:
    name: Sign and attest verified Gateway
    needs: build_scan
    if: needs.build_scan.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      GATEWAY_IMAGE_REF: ${{ needs.build_scan.outputs.image_ref }}
      IMAGE_DIGEST: ${{ needs.build_scan.outputs.image_digest }}
      RELEASE_SOURCE_SHA: ${{ needs.build_scan.outputs.source_sha }}
      CERTIFICATE_IDENTITY: https://github.com/${{ github.workflow_ref }}

    steps:
      - name: Check out merged workflow branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PUBLISH_TOKEN }}

      - name: Revalidate exact source binding
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$GATEWAY_IMAGE_REF" == "$IMAGE_REPOSITORY@$IMAGE_DIGEST" ]]
          git fetch --no-tags origin \
            "+refs/heads/$TRUSTED_SOURCE_BRANCH:refs/remotes/origin/$TRUSTED_SOURCE_BRANCH"
          git cat-file -e "$RELEASE_SOURCE_SHA^{commit}"
          git merge-base --is-ancestor \
            "$RELEASE_SOURCE_SHA" "origin/$TRUSTED_SOURCE_BRANCH"
          git checkout --detach "$RELEASE_SOURCE_SHA"
          git rev-parse HEAD | grep -Fx "$RELEASE_SOURCE_SHA"

      - name: Restore scan evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vera-openclaw-gateway-scan-${{ env.RELEASE_SOURCE_SHA }}
          path: release-evidence/gateway

      - name: Revalidate retained evidence binding
        shell: bash
        run: |
          set -euo pipefail
          grep -Fx "$GATEWAY_IMAGE_REF" release-evidence/gateway/image-reference.txt
          grep -Fx "$RELEASE_SOURCE_SHA" release-evidence/gateway/source-commit.txt
          test -s release-evidence/gateway/gateway.spdx.json
          test -s release-evidence/gateway/trivy-vulnerabilities.json
          sha256sum --check \
            release-evidence/gateway/remote-extension-runtime-lock.sha256
          cmp -- \
            infra/maritime/openclaw/remote-extension-runtime-lock.json \
            release-evidence/gateway/remote-extension-runtime-lock.json

      - name: Write exact-source provenance predicate
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg sourceCommit "$RELEASE_SOURCE_SHA" \
            --arg sourceRepository "https://github.com/$GITHUB_REPOSITORY" \
            --arg workflowRef "$GITHUB_WORKFLOW_REF" \
            '{
              buildDefinition: {
                buildType: "https://actions.github.io/buildtypes/workflow/v1",
                externalParameters: {
                  workflow: {
                    path: ".github/workflows/release-openclaw-gateway.yml",
                    ref: "refs/heads/main",
                    repository: $sourceRepository
                  },
                  sourceCommit: $sourceCommit,
                  dockerfile: "infra/maritime/openclaw/remote-extension.Dockerfile"
                },
                internalParameters: {},
                resolvedDependencies: [{
                  uri: ("git+" + $sourceRepository + "@refs/heads/main"),
                  digest: { gitCommit: $sourceCommit }
                }]
              },
              runDetails: {
                builder: { id: ("https://github.com/" + $workflowRef) },
                metadata: {
                  invocationId: (
                    "https://github.com/" +
                    env.GITHUB_REPOSITORY +
                    "/actions/runs/" +
                    env.GITHUB_RUN_ID
                  )
                }
              }
            }' > release-evidence/gateway/source-provenance-predicate.json

      - name: Attest exact-source provenance
        id: provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ${{ env.IMAGE_REPOSITORY }}
          subject-digest: ${{ env.IMAGE_DIGEST }}
          predicate-type: https://slsa.dev/provenance/v1
          predicate-path: release-evidence/gateway/source-provenance-predicate.json
          push-to-registry: true
          create-storage-record: false

      - name: Attest Gateway SBOM
        id: sbom
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ${{ env.IMAGE_REPOSITORY }}
          subject-digest: ${{ env.IMAGE_DIGEST }}
          sbom-path: release-evidence/gateway/gateway.spdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Install pinned Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Sign and verify Gateway digest
        shell: bash
        run: |
          set -euo pipefail
          cosign sign --yes "$GATEWAY_IMAGE_REF"
          cosign verify "$GATEWAY_IMAGE_REF" \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            > release-evidence/gateway/cosign-verification.json

      - name: Verify exact-source provenance and SBOM attestations
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh attestation verify "oci://$GATEWAY_IMAGE_REF" \
            --repo "$GITHUB_REPOSITORY" \
            --cert-identity "$CERTIFICATE_IDENTITY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-openclaw-gateway.yml" \
            --predicate-type https://slsa.dev/provenance/v1 \
            --format json \
            > release-evidence/gateway/provenance-verification.json
          grep -F "$RELEASE_SOURCE_SHA" \
            release-evidence/gateway/provenance-verification.json
          gh attestation verify "oci://$GATEWAY_IMAGE_REF" \
            --repo "$GITHUB_REPOSITORY" \
            --cert-identity "$CERTIFICATE_IDENTITY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-openclaw-gateway.yml" \
            --predicate-type https://spdx.dev/Document/v2.3 \
            --format json \
            > release-evidence/gateway/sbom-verification.json

      - name: Preserve signed attestation bundles
        shell: bash
        env:
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.sbom.outputs.bundle-path }}
        run: |
          set -euo pipefail
          test -s "$PROVENANCE_BUNDLE"
          test -s "$SBOM_BUNDLE"
          cp -- "$PROVENANCE_BUNDLE" release-evidence/gateway/provenance-bundle.json
          cp -- "$SBOM_BUNDLE" release-evidence/gateway/sbom-bundle.json

      - name: Upload final Gateway release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vera-openclaw-gateway-release-${{ env.RELEASE_SOURCE_SHA }}
          path: release-evidence/gateway/
          if-no-files-found: warn
          retention-days: 30
