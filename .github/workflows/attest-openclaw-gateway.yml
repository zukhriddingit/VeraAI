name: Attest existing zero-finding Vera OpenClaw Gateway

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact merged main commit used to build the existing Gateway.
        required: true
        type: string
      image_digest:
        description: Existing zero-finding Gateway sha256 digest.
        required: true
        type: string
      evidence_run_id:
        description: Publication run whose candidate push completed.
        required: true
        type: string

permissions: {}

concurrency:
  group: attest-existing-openclaw-gateway-${{ inputs.image_digest }}
  cancel-in-progress: false

env:
  IMAGE_REPOSITORY: ghcr.io/zukhriddingit/vera-openclaw-gateway
  TRUSTED_SOURCE_BRANCH: main

jobs:
  sign_existing:
    name: Sign and attest existing verified Gateway
    if: github.repository == 'zukhriddingit/VeraAI' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: write

    steps:
      - name: Check out merged main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve exact existing subject
        id: subject
        shell: bash
        env:
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
          REQUESTED_IMAGE_DIGEST: ${{ inputs.image_digest }}
          REQUESTED_EVIDENCE_RUN_ID: ${{ inputs.evidence_run_id }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "zukhriddingit/VeraAI"
          test "$GITHUB_REF" = "refs/heads/main"
          [[ "$REQUESTED_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$REQUESTED_IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$REQUESTED_EVIDENCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          git fetch --no-tags origin \
            "+refs/heads/$TRUSTED_SOURCE_BRANCH:refs/remotes/origin/$TRUSTED_SOURCE_BRANCH"
          git cat-file -e "$REQUESTED_SOURCE_SHA^{commit}"
          git merge-base --is-ancestor \
            "$REQUESTED_SOURCE_SHA" "origin/$TRUSTED_SOURCE_BRANCH"
          git checkout --detach "$REQUESTED_SOURCE_SHA"
          git rev-parse HEAD | grep -Fx "$REQUESTED_SOURCE_SHA"
          image_ref="$IMAGE_REPOSITORY@$REQUESTED_IMAGE_DIGEST"
          printf 'source_sha=%s\n' "$REQUESTED_SOURCE_SHA" >> "$GITHUB_OUTPUT"
          printf 'image_digest=%s\n' "$REQUESTED_IMAGE_DIGEST" >> "$GITHUB_OUTPUT"
          printf 'digest_hex=%s\n' "${REQUESTED_IMAGE_DIGEST#sha256:}" >> "$GITHUB_OUTPUT"
          printf 'image_ref=%s\n' "$image_ref" >> "$GITHUB_OUTPUT"
          printf 'evidence_run_id=%s\n' "$REQUESTED_EVIDENCE_RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Verify source publication run is recoverable
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_RUN_ID: ${{ steps.subject.outputs.evidence_run_id }}
          RELEASE_SOURCE_SHA: ${{ steps.subject.outputs.source_sha }}
        run: |
          set -euo pipefail
          run_metadata="$(gh run view "$EVIDENCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --json event,headSha,workflowName)"
          test "$(jq -r '.event' <<< "$run_metadata")" = "workflow_dispatch"
          test "$(jq -r '.headSha' <<< "$run_metadata")" = "$RELEASE_SOURCE_SHA"
          test "$(jq -r '.workflowName' <<< "$run_metadata")" = \
            "Release immutable Vera OpenClaw Gateway"
          gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$EVIDENCE_RUN_ID/jobs" \
            | jq -e '
                def step_ok($name; $conclusion):
                  [
                    .steps[]? |
                    select(
                      .name == $name and
                      .conclusion == $conclusion
                    )
                  ] | length == 1;
                [.jobs[] |
                  select(
                    .name == "Build and scan Gateway candidate"
                  ) |
                  select(
                    .conclusion == "success" or
                    (
                      .conclusion == "failure" and
                      step_ok(
                        "Build and publish the commit-bound Gateway";
                        "success"
                      ) and
                      step_ok(
                        "Resolve immutable Gateway reference";
                        "success"
                      ) and
                      step_ok(
                        "Verify minimal published runtime identity";
                        "failure"
                      ) and
                      step_ok(
                        "Generate SBOM and vulnerability evidence";
                        "skipped"
                      ) and
                      step_ok(
                        "Enforce zero unresolved critical or high findings";
                        "skipped"
                      ) and
                      step_ok(
                        "Preserve pre-signing Gateway evidence";
                        "success"
                      )
                    )
                  )
                ] | length == 1
              '

      - name: Restore successful scan evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.subject.outputs.evidence_run_id }}
          name: vera-openclaw-gateway-scan-${{ steps.subject.outputs.source_sha }}
          path: release-evidence/gateway

      - name: Revalidate retained publication evidence
        shell: bash
        env:
          GATEWAY_IMAGE_REF: ${{ steps.subject.outputs.image_ref }}
          RELEASE_SOURCE_SHA: ${{ steps.subject.outputs.source_sha }}
        run: |
          set -euo pipefail
          grep -Fx "$GATEWAY_IMAGE_REF" release-evidence/gateway/image-reference.txt
          grep -Fx "$RELEASE_SOURCE_SHA" release-evidence/gateway/source-commit.txt
          expected_lock_hash="$(cut -d ' ' -f1 \
            release-evidence/gateway/remote-extension-runtime-lock.sha256)"
          observed_lock_hash="$(sha256sum \
            release-evidence/gateway/remote-extension-runtime-lock.json \
            | cut -d ' ' -f1)"
          test "$expected_lock_hash" = "$observed_lock_hash"
          cmp -- \
            infra/maritime/openclaw/remote-extension-runtime-lock.json \
            release-evidence/gateway/remote-extension-runtime-lock.json

      - name: Install pinned Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.72.0
          cache: false

      - name: Verify anonymous image pull and immutable runtime
        shell: bash
        env:
          GATEWAY_IMAGE_REF: ${{ steps.subject.outputs.image_ref }}
          RELEASE_SOURCE_SHA: ${{ steps.subject.outputs.source_sha }}
        run: |
          set -euo pipefail
          docker pull "$GATEWAY_IMAGE_REF"
          test "$(docker image inspect "$GATEWAY_IMAGE_REF" \
            --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = \
            "$RELEASE_SOURCE_SHA"
          test "$(docker image inspect "$GATEWAY_IMAGE_REF" \
            --format '{{ index .Config.Labels "io.vera.openclaw.image.digest" }}')" = \
            "sha256:6a31d44b2944e7adcd2b582bf6fb463111264ebca97a0201795b799135bd102c"
          test "$(docker image inspect "$GATEWAY_IMAGE_REF" \
            --format '{{ index .Config.Labels "org.opencontainers.image.base.digest" }}')" = \
            "sha256:f077d539a12eee7b7cd0ae1f79b3b779a82e72c93e274983aa0cd0f6519a70c2"
          node scripts/verify-gateway-image-layout.mjs \
            --image-ref "$GATEWAY_IMAGE_REF" \
            --simulate-bootstrap

      - name: Generate fresh SBOM and vulnerability evidence
        shell: bash
        env:
          GATEWAY_IMAGE_REF: ${{ steps.subject.outputs.image_ref }}
        run: |
          set -euo pipefail
          trivy --config /dev/null image --quiet --ignorefile /dev/null --list-all-pkgs \
            --format spdx-json \
            --output release-evidence/gateway/gateway.spdx.json \
            "$GATEWAY_IMAGE_REF"
          trivy --config /dev/null image --quiet --ignorefile /dev/null --list-all-pkgs \
            --scanners vuln --ignore-unfixed=false --severity CRITICAL,HIGH --exit-code 0 \
            --format json \
            --output release-evidence/gateway/trivy-vulnerabilities.json \
            "$GATEWAY_IMAGE_REF"
          trivy version --format json > release-evidence/gateway/trivy-version.json

      - name: Enforce fresh zero unresolved critical or high findings
        shell: bash
        env:
          GATEWAY_IMAGE_REF: ${{ steps.subject.outputs.image_ref }}
        run: |
          set -euo pipefail
          test -s release-evidence/gateway/gateway.spdx.json
          test -s release-evidence/gateway/trivy-vulnerabilities.json
          test "$(jq '[.Results[]?.Vulnerabilities[]?] | length' \
            release-evidence/gateway/trivy-vulnerabilities.json)" = "0"
          trivy --config /dev/null image --quiet --ignorefile /dev/null --list-all-pkgs \
            --scanners vuln --ignore-unfixed=false --severity CRITICAL,HIGH --exit-code 1 \
            "$GATEWAY_IMAGE_REF"

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PUBLISH_TOKEN }}

      - name: Write exact-source provenance predicate
        shell: bash
        env:
          EVIDENCE_RUN_ID: ${{ steps.subject.outputs.evidence_run_id }}
          GATEWAY_IMAGE_DIGEST: ${{ steps.subject.outputs.image_digest }}
          RELEASE_SOURCE_SHA: ${{ steps.subject.outputs.source_sha }}
        run: |
          set -euo pipefail
          jq -n \
            --arg attestationInvocationId \
              "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" \
            --arg eventName "$GITHUB_EVENT_NAME" \
            --arg evidenceRunId "$EVIDENCE_RUN_ID" \
            --arg imageDigest "$GATEWAY_IMAGE_DIGEST" \
            --arg publicationInvocationId \
              "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$EVIDENCE_RUN_ID" \
            --arg repositoryId "$GITHUB_REPOSITORY_ID" \
            --arg repositoryOwnerId "$GITHUB_REPOSITORY_OWNER_ID" \
            --arg runnerEnvironment "$RUNNER_ENVIRONMENT" \
            --arg serverUrl "$GITHUB_SERVER_URL" \
            --arg sourceCommit "$RELEASE_SOURCE_SHA" \
            --arg sourceRepository "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --arg workflowCommit "$GITHUB_SHA" \
            --arg workflowRef "$GITHUB_WORKFLOW_REF" \
            '{
              buildDefinition: {
                buildType: "https://actions.github.io/buildtypes/workflow/v1",
                externalParameters: {
                  workflow: {
                    path: ".github/workflows/attest-openclaw-gateway.yml",
                    ref: "refs/heads/main",
                    repository: $sourceRepository
                  },
                  sourceCommit: $sourceCommit,
                  imageDigest: $imageDigest,
                  dockerfile: "infra/maritime/openclaw/remote-extension.Dockerfile",
                  publicationEvidence: {
                    workflow: {
                      path: ".github/workflows/release-openclaw-gateway.yml",
                      ref: "refs/heads/main",
                      repository: $sourceRepository
                    },
                    runId: $evidenceRunId,
                    invocationId: $publicationInvocationId
                  }
                },
                internalParameters: {
                  github: {
                    event_name: $eventName,
                    repository_id: $repositoryId,
                    repository_owner_id: $repositoryOwnerId,
                    runner_environment: $runnerEnvironment
                  }
                },
                resolvedDependencies: [{
                  uri: ("git+" + $sourceRepository + "@refs/heads/main"),
                  digest: { gitCommit: $workflowCommit }
                }]
              },
              runDetails: {
                builder: { id: ($serverUrl + "/" + $workflowRef) },
                metadata: { invocationId: $attestationInvocationId }
              }
            }' > release-evidence/gateway/source-provenance-predicate.json

      - name: Install pinned Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Sign existing Gateway digest
        shell: bash
        env:
          GATEWAY_IMAGE_REF: ${{ steps.subject.outputs.image_ref }}
        run: |
          set -euo pipefail
          cosign sign --yes \
            --bundle release-evidence/gateway/cosign-signature-bundle.json \
            "$GATEWAY_IMAGE_REF"

      - name: Attest exact-source provenance and Gateway SBOM
        shell: bash
        env:
          GATEWAY_IMAGE_REF: ${{ steps.subject.outputs.image_ref }}
          PROVENANCE_PREDICATE_TYPE: https://slsa.dev/provenance/v1
          SBOM_PREDICATE_TYPE: https://spdx.dev/Document/v2.3
        run: |
          set -euo pipefail
          cosign attest --yes \
            --predicate release-evidence/gateway/source-provenance-predicate.json \
            --type "$PROVENANCE_PREDICATE_TYPE" \
            --bundle release-evidence/gateway/provenance-bundle.json \
            "$GATEWAY_IMAGE_REF"
          cosign attest --yes \
            --predicate release-evidence/gateway/gateway.spdx.json \
            --type "$SBOM_PREDICATE_TYPE" \
            --bundle release-evidence/gateway/sbom-bundle.json \
            "$GATEWAY_IMAGE_REF"

      - name: Verify Gateway signature
        shell: bash
        env:
          CERTIFICATE_IDENTITY: https://github.com/${{ github.workflow_ref }}
          GATEWAY_IMAGE_REF: ${{ steps.subject.outputs.image_ref }}
        run: |
          set -euo pipefail
          cosign verify "$GATEWAY_IMAGE_REF" \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            > release-evidence/gateway/cosign-verification.json

      - name: Verify exact-source provenance and SBOM attestations
        shell: bash
        env:
          CERTIFICATE_IDENTITY: https://github.com/${{ github.workflow_ref }}
          GATEWAY_IMAGE_DIGEST: ${{ steps.subject.outputs.image_digest }}
          GATEWAY_IMAGE_REF: ${{ steps.subject.outputs.image_ref }}
          PROVENANCE_PREDICATE_TYPE: https://slsa.dev/provenance/v1
          RELEASE_SOURCE_SHA: ${{ steps.subject.outputs.source_sha }}
          SBOM_PREDICATE_TYPE: https://spdx.dev/Document/v2.3
        run: |
          set -euo pipefail
          cosign verify-attestation "$GATEWAY_IMAGE_REF" \
            --type "$PROVENANCE_PREDICATE_TYPE" \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            > release-evidence/gateway/provenance-verification.json
          cosign verify-attestation "$GATEWAY_IMAGE_REF" \
            --type "$SBOM_PREDICATE_TYPE" \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            > release-evidence/gateway/sbom-verification.json

          select_verified_statement() {
            local verification_path="$1"
            local predicate_type="$2"
            local expected_predicate_path="$3"
            local selected_statement_path="$4"
            local encoded_payload
            local candidate_statement
            local expected_predicate
            local observed_predicate
            local found=0

            candidate_statement="$(mktemp "$RUNNER_TEMP/vera-statement.XXXXXX")"
            expected_predicate="$(mktemp "$RUNNER_TEMP/vera-predicate-expected.XXXXXX")"
            observed_predicate="$(mktemp "$RUNNER_TEMP/vera-predicate-observed.XXXXXX")"
            jq -S -c . "$expected_predicate_path" > "$expected_predicate"

            while IFS= read -r encoded_payload; do
              printf '%s' "$encoded_payload" \
                | base64 --decode > "$candidate_statement"
              if ! jq -e \
                --arg digest "${GATEWAY_IMAGE_DIGEST#sha256:}" \
                --arg predicateType "$predicate_type" \
                '(.predicateType == $predicateType) and
                 any(.subject[]?; .digest.sha256 == $digest)' \
                "$candidate_statement" > /dev/null; then
                continue
              fi
              jq -S -c .predicate "$candidate_statement" > "$observed_predicate"
              if cmp -s -- "$expected_predicate" "$observed_predicate"; then
                cp -- "$candidate_statement" "$selected_statement_path"
                found=1
                break
              fi
            done < <(
              jq -sr \
                'map(if type == "array" then .[] else . end)
                 | .[] | .payload // empty' \
                "$verification_path"
            )

            test "$found" = "1"
          }

          select_verified_statement \
            release-evidence/gateway/provenance-verification.json \
            "$PROVENANCE_PREDICATE_TYPE" \
            release-evidence/gateway/source-provenance-predicate.json \
            release-evidence/gateway/source-provenance-statement.json
          jq -e \
            --arg digest "$GATEWAY_IMAGE_DIGEST" \
            --arg sourceCommit "$RELEASE_SOURCE_SHA" \
            '.predicate.buildDefinition.externalParameters.sourceCommit == $sourceCommit and
             .predicate.buildDefinition.externalParameters.imageDigest == $digest' \
            release-evidence/gateway/source-provenance-statement.json > /dev/null

          select_verified_statement \
            release-evidence/gateway/sbom-verification.json \
            "$SBOM_PREDICATE_TYPE" \
            release-evidence/gateway/gateway.spdx.json \
            release-evidence/gateway/sbom-statement.json
          jq -e '.predicate.spdxVersion == "SPDX-2.3"' \
            release-evidence/gateway/sbom-statement.json > /dev/null

      - name: Preserve signed attestation bundles
        shell: bash
        run: |
          set -euo pipefail
          test -s release-evidence/gateway/cosign-signature-bundle.json
          test -s release-evidence/gateway/provenance-bundle.json
          test -s release-evidence/gateway/sbom-bundle.json
          test -s release-evidence/gateway/source-provenance-statement.json
          test -s release-evidence/gateway/sbom-statement.json

      - name: Upload signing-resume evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vera-openclaw-gateway-attestation-${{ steps.subject.outputs.digest_hex }}
          path: release-evidence/gateway/
          if-no-files-found: error
          retention-days: 30
