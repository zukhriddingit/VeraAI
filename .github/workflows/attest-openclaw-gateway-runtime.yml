name: Attest existing Vera OpenClaw Gateway runtime

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact merged source commit used to build the existing runtime.
        required: true
        type: string
      release_index_digest:
        description: Exact published release-index digest that selects the runtime.
        required: true
        type: string
      runtime_manifest_digest:
        description: Exact existing linux/amd64 runtime-manifest digest.
        required: true
        type: string
      evidence_run_id:
        description: Original verified Gateway publication workflow run.
        required: true
        type: string

permissions: {}

concurrency:
  group: attest-existing-openclaw-runtime-${{ inputs.runtime_manifest_digest }}
  cancel-in-progress: false

env:
  IMAGE_REPOSITORY: ghcr.io/zukhriddingit/vera-openclaw-gateway
  TRUSTED_SOURCE_BRANCH: main
  PREVIOUS_RELEASE_INDEX: ghcr.io/zukhriddingit/vera-openclaw-gateway@sha256:69ee4537790f06221487bb0c39c4da91c25dbdbb63fad56be16a1a6de093b7d3
  VERA_GATEWAY_REGISTRY_OUTPUT_DIRECTORY: release-evidence/gateway-runtime

jobs:
  attest_existing_runtime:
    name: Revalidate and attest existing Gateway runtime
    if: github.repository == 'zukhriddingit/VeraAI' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Check out merged main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve exact existing runtime subject
        id: subject
        shell: bash
        env:
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
          REQUESTED_RELEASE_INDEX_DIGEST: ${{ inputs.release_index_digest }}
          REQUESTED_RUNTIME_MANIFEST_DIGEST: ${{ inputs.runtime_manifest_digest }}
          REQUESTED_EVIDENCE_RUN_ID: ${{ inputs.evidence_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "zukhriddingit/VeraAI"
          test "$GITHUB_REF" = "refs/heads/$TRUSTED_SOURCE_BRANCH"
          [[ "$REQUESTED_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$REQUESTED_RELEASE_INDEX_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$REQUESTED_RUNTIME_MANIFEST_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$REQUESTED_EVIDENCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          git fetch --no-tags origin \
            "+refs/heads/$TRUSTED_SOURCE_BRANCH:refs/remotes/origin/$TRUSTED_SOURCE_BRANCH"
          git cat-file -e "$REQUESTED_SOURCE_SHA^{commit}"
          git merge-base --is-ancestor \
            "$REQUESTED_SOURCE_SHA" "origin/$TRUSTED_SOURCE_BRANCH"
          test "$(git rev-parse "$REQUESTED_SOURCE_SHA^{commit}")" = "$REQUESTED_SOURCE_SHA"
          jq -e \
            --arg sourceCommit "$REQUESTED_SOURCE_SHA" \
            --arg releaseIndex "$IMAGE_REPOSITORY@$REQUESTED_RELEASE_INDEX_DIGEST" \
            --arg runtimeManifest "$IMAGE_REPOSITORY@$REQUESTED_RUNTIME_MANIFEST_DIGEST" \
            '.schemaVersion == "2" and
             .publicationState == "published" and
             .sourceCommit == $sourceCommit and
             .releaseIndex == $releaseIndex and
             .runtimeManifest == $runtimeManifest and
             .runtimeSelectionState == "diagnostic_pending" and
             .deployableBeforeLiveProxyAcceptance == false' \
            infra/maritime/openclaw/remote-extension-image.json
          run_json="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/$GITHUB_REPOSITORY/actions/runs/$REQUESTED_EVIDENCE_RUN_ID")"
          test "$(jq -r '.name' <<< "$run_json")" = \
            "Release immutable Vera OpenClaw Gateway"
          test "$(jq -r '.path' <<< "$run_json")" = \
            ".github/workflows/release-openclaw-gateway.yml"
          test "$(jq -r '.event' <<< "$run_json")" = "workflow_dispatch"
          test "$(jq -r '.head_branch' <<< "$run_json")" = "$TRUSTED_SOURCE_BRANCH"
          test "$(jq -r '.conclusion' <<< "$run_json")" = "success"
          git checkout --detach "$REQUESTED_SOURCE_SHA"
          openclaw_base="$(jq -r '.baseImage' \
            infra/maritime/openclaw/remote-extension-image.json)"
          runtime_base="$(jq -r '.runtimeBaseImage' \
            infra/maritime/openclaw/remote-extension-image.json)"
          runtime_lock_sha256="$(sha256sum \
            infra/maritime/openclaw/remote-extension-runtime-lock.json | cut -d ' ' -f1)"
          [[ "$openclaw_base" =~ @sha256:[a-f0-9]{64}$ ]]
          [[ "$runtime_base" =~ @sha256:[a-f0-9]{64}$ ]]
          [[ "$runtime_lock_sha256" =~ ^[a-f0-9]{64}$ ]]
          printf 'source_sha=%s\n' "$REQUESTED_SOURCE_SHA" >> "$GITHUB_OUTPUT"
          printf 'release_index_digest=%s\n' \
            "$REQUESTED_RELEASE_INDEX_DIGEST" >> "$GITHUB_OUTPUT"
          printf 'runtime_manifest_digest=%s\n' \
            "$REQUESTED_RUNTIME_MANIFEST_DIGEST" >> "$GITHUB_OUTPUT"
          printf 'evidence_run_id=%s\n' "$REQUESTED_EVIDENCE_RUN_ID" >> "$GITHUB_OUTPUT"
          printf 'runtime_image_ref=%s\n' \
            "$IMAGE_REPOSITORY@$REQUESTED_RUNTIME_MANIFEST_DIGEST" >> "$GITHUB_OUTPUT"
          printf 'openclaw_base=%s\n' "$openclaw_base" >> "$GITHUB_OUTPUT"
          printf 'runtime_base=%s\n' "$runtime_base" >> "$GITHUB_OUTPUT"
          printf 'runtime_lock_sha256=%s\n' \
            "$runtime_lock_sha256" >> "$GITHUB_OUTPUT"
          printf 'digest_hex=%s\n' \
            "${REQUESTED_RUNTIME_MANIFEST_DIGEST#sha256:}" >> "$GITHUB_OUTPUT"

      - name: Download original verified publication evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vera-openclaw-gateway-scan-${{ steps.subject.outputs.source_sha }}
          path: release-evidence/original-publication
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.subject.outputs.evidence_run_id }}

      - name: Revalidate original publication evidence
        shell: bash
        run: |
          set -euo pipefail
          grep -Fx "${{ steps.subject.outputs.source_sha }}" \
            release-evidence/original-publication/source-commit.txt
          grep -Fx \
            "$IMAGE_REPOSITORY@${{ steps.subject.outputs.release_index_digest }}" \
            release-evidence/original-publication/image-reference.txt
          expected_lock_hash="$(cut -d ' ' -f1 \
            release-evidence/original-publication/remote-extension-runtime-lock.sha256)"
          observed_lock_hash="$(sha256sum \
            release-evidence/original-publication/remote-extension-runtime-lock.json \
            | cut -d ' ' -f1)"
          test "$expected_lock_hash" = "$observed_lock_hash"
          cmp -- \
            infra/maritime/openclaw/remote-extension-runtime-lock.json \
            release-evidence/original-publication/remote-extension-runtime-lock.json

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.14.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install exact-source dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify exact-source boundaries
        run: |
          set -euo pipefail
          git rev-parse HEAD | grep -Fx "${{ steps.subject.outputs.source_sha }}"
          git diff --exit-code -- .
          git diff --cached --exit-code -- .
          pnpm verify:gateway-runtime-supply-chain
          pnpm verify:remote-extension-config
          pnpm verify:gateway-registry-workflow

      - name: Verify release index contains the exact child anonymously
        shell: bash
        run: |
          set -euo pipefail
          pnpm inspect:gateway-registry -- \
            --current-index \
              "$IMAGE_REPOSITORY@${{ steps.subject.outputs.release_index_digest }}" \
            --previous-index "$PREVIOUS_RELEASE_INDEX" \
            --output release-evidence/gateway-runtime/inspection.json
          jq -e \
            --arg child "${{ steps.subject.outputs.runtime_manifest_digest }}" \
            '.current.runtimeManifestDigest == $child and
             .current.runtimeDescriptor.digest == $child and
             .current.runnablePlatformCount == 1' \
            release-evidence/gateway-runtime/inspection.json

      - name: Pull and verify existing runtime anonymously
        shell: bash
        env:
          RUNTIME_IMAGE_REF: ${{ steps.subject.outputs.runtime_image_ref }}
        run: |
          set -euo pipefail
          docker pull "$RUNTIME_IMAGE_REF"
          node scripts/verify-gateway-image-layout.mjs \
            --image-ref "$RUNTIME_IMAGE_REF" \
            --simulate-bootstrap
          test "$(docker image inspect "$RUNTIME_IMAGE_REF" \
            --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = \
            "${{ steps.subject.outputs.source_sha }}"

      - name: Install pinned Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.72.0
          cache: false

      - name: Generate fresh exact-child SBOM and vulnerability evidence
        shell: bash
        env:
          RUNTIME_IMAGE_REF: ${{ steps.subject.outputs.runtime_image_ref }}
        run: |
          set -euo pipefail
          trivy --config /dev/null image --quiet --ignorefile /dev/null --list-all-pkgs \
            --format spdx-json \
            --output release-evidence/gateway-runtime/gateway-runtime.spdx.json \
            "$RUNTIME_IMAGE_REF"
          trivy --config /dev/null image --quiet --ignorefile /dev/null --list-all-pkgs \
            --scanners vuln --ignore-unfixed=false --severity CRITICAL,HIGH --exit-code 0 \
            --format json \
            --output release-evidence/gateway-runtime/trivy-vulnerabilities.json \
            "$RUNTIME_IMAGE_REF"
          trivy version --format json \
            > release-evidence/gateway-runtime/trivy-version.json

      - name: Enforce fresh zero unresolved critical or high findings
        shell: bash
        env:
          RUNTIME_IMAGE_REF: ${{ steps.subject.outputs.runtime_image_ref }}
        run: |
          set -euo pipefail
          test -s release-evidence/gateway-runtime/gateway-runtime.spdx.json
          test -s release-evidence/gateway-runtime/trivy-vulnerabilities.json
          trivy --config /dev/null image --quiet --ignorefile /dev/null --list-all-pkgs \
            --scanners vuln --ignore-unfixed=false --severity CRITICAL,HIGH --exit-code 1 \
            "$RUNTIME_IMAGE_REF"
          test "$(jq '[.Results[]?.Vulnerabilities[]?] | length' \
            release-evidence/gateway-runtime/trivy-vulnerabilities.json)" = "0"

      - name: Sign in to GitHub Container Registry after verification
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PUBLISH_TOKEN }}

      - name: Create exact-child provenance predicate
        shell: bash
        env:
          RUNTIME_MANIFEST_DIGEST: ${{ steps.subject.outputs.runtime_manifest_digest }}
          RELEASE_INDEX_DIGEST: ${{ steps.subject.outputs.release_index_digest }}
          RELEASE_SOURCE_SHA: ${{ steps.subject.outputs.source_sha }}
          EVIDENCE_RUN_ID: ${{ steps.subject.outputs.evidence_run_id }}
          OPENCLAW_BASE: ${{ steps.subject.outputs.openclaw_base }}
          RUNTIME_BASE: ${{ steps.subject.outputs.runtime_base }}
          RUNTIME_LOCK_SHA256: ${{ steps.subject.outputs.runtime_lock_sha256 }}
        run: |
          set -euo pipefail
          jq -n \
            --arg sourceCommit "$RELEASE_SOURCE_SHA" \
            --arg runtimeDigest "$RUNTIME_MANIFEST_DIGEST" \
            --arg releaseIndexDigest "$RELEASE_INDEX_DIGEST" \
            --arg evidenceRunId "$EVIDENCE_RUN_ID" \
            --arg openclawBase "$OPENCLAW_BASE" \
            --arg runtimeBase "$RUNTIME_BASE" \
            --arg runtimeLockSha256 "$RUNTIME_LOCK_SHA256" \
            --arg sourceRepository "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --arg workflowRef "$GITHUB_WORKFLOW_REF" \
            --arg serverUrl "$GITHUB_SERVER_URL" \
            '{
              buildDefinition: {
                buildType: "https://actions.github.io/buildtypes/workflow/v1",
                externalParameters: {
                  workflow: {
                    path: ".github/workflows/attest-openclaw-gateway-runtime.yml",
                    ref: "refs/heads/main",
                    repository: $sourceRepository
                  },
                  sourceCommit: $sourceCommit,
                  existingRuntimeDigest: $runtimeDigest,
                  originalPublicationRunId: $evidenceRunId
                },
                internalParameters: {
                  recoveryMode: "attest-existing-runtime-without-rebuild"
                },
                resolvedDependencies: [
                  {
                    uri: ("git+" + $sourceRepository + "@refs/heads/main"),
                    digest: { gitCommit: $sourceCommit }
                  },
                  {
                    uri: "oci://ghcr.io/zukhriddingit/vera-openclaw-gateway",
                    digest: { sha256: ($releaseIndexDigest | sub("^sha256:"; "")) }
                  },
                  {
                    uri: ($openclawBase | sub("@sha256:.*$"; "")),
                    digest: { sha256: ($openclawBase | sub("^.*@sha256:"; "")) }
                  },
                  {
                    uri: ($runtimeBase | sub("@sha256:.*$"; "")),
                    digest: { sha256: ($runtimeBase | sub("^.*@sha256:"; "")) }
                  },
                  {
                    uri: (
                      "git+" + $sourceRepository +
                      "/infra/maritime/openclaw/remote-extension-runtime-lock.json"
                    ),
                    digest: { sha256: $runtimeLockSha256 }
                  }
                ]
              },
              runDetails: {
                builder: { id: ($serverUrl + "/" + $workflowRef) },
                metadata: {
                  invocationId: (
                    $serverUrl + "/" + env.GITHUB_REPOSITORY +
                    "/actions/runs/" + env.GITHUB_RUN_ID +
                    "/attempts/" + env.GITHUB_RUN_ATTEMPT
                  )
                }
              }
            }' > release-evidence/gateway-runtime/source-provenance-predicate.json

      - name: Attest exact-child source provenance
        id: provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ${{ env.IMAGE_REPOSITORY }}
          subject-digest: ${{ steps.subject.outputs.runtime_manifest_digest }}
          predicate-type: https://slsa.dev/provenance/v1
          predicate-path: release-evidence/gateway-runtime/source-provenance-predicate.json
          push-to-registry: true
          create-storage-record: false

      - name: Attest exact-child SPDX SBOM
        id: sbom
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ${{ env.IMAGE_REPOSITORY }}
          subject-digest: ${{ steps.subject.outputs.runtime_manifest_digest }}
          sbom-path: release-evidence/gateway-runtime/gateway-runtime.spdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Install pinned Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Sign and verify the exact existing child
        shell: bash
        env:
          RUNTIME_IMAGE_REF: ${{ steps.subject.outputs.runtime_image_ref }}
          CERTIFICATE_IDENTITY: https://github.com/${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          cosign sign --yes "$RUNTIME_IMAGE_REF"
          cosign verify "$RUNTIME_IMAGE_REF" \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            > release-evidence/gateway-runtime/cosign-verification.json

      - name: Verify exact-child provenance and SBOM attestations
        shell: bash
        env:
          RUNTIME_IMAGE_REF: ${{ steps.subject.outputs.runtime_image_ref }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_SOURCE_SHA: ${{ steps.subject.outputs.source_sha }}
        run: |
          set -euo pipefail
          gh attestation verify "oci://$RUNTIME_IMAGE_REF" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow \
              "$GITHUB_REPOSITORY/.github/workflows/attest-openclaw-gateway-runtime.yml" \
            --predicate-type https://slsa.dev/provenance/v1 \
            --format json \
            > release-evidence/gateway-runtime/provenance-verification.json
          grep -F "$RELEASE_SOURCE_SHA" \
            release-evidence/gateway-runtime/provenance-verification.json
          gh attestation verify "oci://$RUNTIME_IMAGE_REF" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow \
              "$GITHUB_REPOSITORY/.github/workflows/attest-openclaw-gateway-runtime.yml" \
            --predicate-type https://spdx.dev/Document/v2.3 \
            --format json \
            > release-evidence/gateway-runtime/sbom-verification.json

      - name: Preserve exact-child attestation bundles
        shell: bash
        env:
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.sbom.outputs.bundle-path }}
        run: |
          set -euo pipefail
          test -s "$PROVENANCE_BUNDLE"
          test -s "$SBOM_BUNDLE"
          cp -- "$PROVENANCE_BUNDLE" \
            release-evidence/gateway-runtime/provenance-bundle.json
          cp -- "$SBOM_BUNDLE" \
            release-evidence/gateway-runtime/sbom-bundle.json

      - name: Upload exact-child supply-chain evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vera-openclaw-gateway-runtime-${{ steps.subject.outputs.digest_hex }}
          path: release-evidence/gateway-runtime/
          if-no-files-found: error
          retention-days: 30
